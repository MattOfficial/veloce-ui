name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PACKAGE_NAME: "@mattofficial/veloce-ui"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.should-publish.outputs.should_publish }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Add 'v' prefix if not present
            if [[ ! $VERSION =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
          elif [[ ${{ github.ref }} =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must match pattern v*.*.* (e.g., v1.0.0)"
            echo "Received: $VERSION"
            exit 1
          fi
          echo "✓ Version format is valid: $VERSION"

      - name: Check if version already exists in registry
        id: should-publish
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${VERSION#v}"

          # Try to fetch package info
          if npm view ${{ env.PACKAGE_NAME }}@$TAG_VERSION --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⚠️ Version $TAG_VERSION already exists in registry. Skipping publish."
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✓ Version $TAG_VERSION will be published"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build output
        run: |
          echo "Verifying build output..."
          test -f dist/index.js && echo "✓ ESM bundle found"
          test -f dist/index.cjs && echo "✓ CJS bundle found"
          test -f dist/index.d.ts && echo "✓ TypeScript definitions found"
          test -f dist/styles.css && echo "✓ CSS styles found"
          echo "Build verification complete!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
          retention-days: 1

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.should_publish == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@mattofficial:registry=https://npm.pkg.github.com" >> .npmrc
          echo "always-auth=true" >> .npmrc
          echo "✓ NPM configured for GitHub Packages"

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG_VERSION="${VERSION#v}"

          # Update version in package.json to match tag
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify publication
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG_VERSION="${VERSION#v}"
          sleep 5
          if npm view ${{ env.PACKAGE_NAME }}@$TAG_VERSION --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "✓ Package published successfully!"
          else
            echo "⚠️ Could not verify publication (may need more time to propagate)"
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    if: needs.validate.outputs.tag_exists == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG_VERSION="${VERSION#v}"

          # Generate changelog from commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --no-merges --pretty=format:"- %s (%h)" "$PREV_TAG..$VERSION" 2>/dev/null || git log --no-merges --pretty=format:"- %s (%h)" -n 20)
          else
            CHANGES=$(git log --no-merges --pretty=format:"- %s (%h)" -n 20)
          fi

          echo "changelog=$CHANGES" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.release-notes.outputs.changelog }}

            ## 🚀 Usage

            ```bash
            npm install @mattofficial/veloce-ui
            ```

            Or with yarn:
            ```bash
            yarn add @mattofficial/veloce-ui
            ```

            ---
            **Full Changelog**: https://github.com/MattOfficial/veloce-ui/compare/${{ github.event.inputs.previous_tag }}...${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, 'alpha') || contains(needs.validate.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  storybook:
    name: Deploy Storybook
    runs-on: ubuntu-latest
    needs: [validate, publish]
    if: needs.validate.outputs.tag_exists == 'true'

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
